<section class="info-page" id="about" aria-label="About"><a class="return" href="#">← INDEX</a><h2>ABOUT</h2><p>SOTA TEZUKA</p><p>Profile content has not yet been supplied.</p></section><section class="info-page" id="store" aria-label="Store"><a class="return" href="#">← INDEX</a><h2>STORE</h2><p>Store content has not yet been supplied.</p></section><section class="info-page" id="contact" aria-label="Contact"><a class="return" href="#">← INDEX</a><h2>CONTACT</h2><p>Contact details have not yet been supplied.</p></section><script>(()=>{'use strict';
const home=document.getElementById('home'),site=document.getElementById('site');
function syncPage(){const route=location.hash.replace('#','');const showing=route==='works'||route==='projects';home.classList.toggle('is-hidden',!!route);site.classList.toggle('is-visible',showing);for(const id of ['about','contact','store'])document.getElementById(id).classList.toggle('is-visible',route===id);document.title=(route?route.toUpperCase()+' — ':'')+'SOTA TEZUKA';const lb=document.getElementById('lightbox');if(!showing&&lb.open)lb.close();window.scrollTo(0,0)}
document.getElementById('back').addEventListener('click',()=>{location.hash='';syncPage()});window.addEventListener('hashchange',syncPage);window.addEventListener('popstate',syncPage);syncPage();
// Replace image paths and titles below with your actual works. All source images are placeholders.
const works=Array.from({length:12},(_,i)=>({src:`images/${String(i+1).padStart(2,'0')}.svg`,title:`IMAGE ${String(i+1).padStart(2,'0')}`}));
const gallery=document.getElementById('gallery'),dialog=document.getElementById('lightbox');let active=0;
// The original file is preserved; only the thumbnail is transformed after loading.
// Inspired by 1920s French surrealist cinema: monochrome, coarse film grain,
// limited tonal range, soft focus, vignette and subtle scratches.
function processThumbnail(img, canvas, index){
  const W=280,H=198;canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)return;
  const ratio=Math.max(W/img.naturalWidth,H/img.naturalHeight);
  const w=img.naturalWidth*ratio,h=img.naturalHeight*ratio;
  ctx.fillStyle='#ddd';ctx.fillRect(0,0,W,H);
  ctx.filter='grayscale(1) contrast(1.38) brightness(1.06) blur(.5px)';
  ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);ctx.filter='none';
  const frame=ctx.getImageData(0,0,W,H),d=frame.data;
  let seed=(index+1)*2654435761>>>0;
  function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=(y*W+x)*4;
    const lum=.299*d[k]+.587*d[k+1]+.114*d[k+2];
    const dx=(x-W/2)/(W/2),dy=(y-H/2)/(H/2);
    const vignette=Math.max(0,dx*dx+dy*dy-.15)*18;
    const grain=(rand()-.5)*38;
    const tone=Math.max(0,Math.min(255,lum-vignette+grain));
    const quant=Math.round(tone/17)*17;
    d[k]=d[k+1]=d[k+2]=quant;
  }
  ctx.putImageData(frame,0,0);
  ctx.globalAlpha=.12;ctx.strokeStyle='#fff';ctx.lineWidth=.6;
  for(let j=0;j<3;j++){
    const x=rand()*W;ctx.beginPath();ctx.moveTo(x,rand()*H*.2);ctx.lineTo(x+(rand()-.5)*3,H*(.75+rand()*.25));ctx.stroke();
  }
  ctx.globalAlpha=1;
}
for(let i=0;i<works.length;i++){
 const work=works[i],figure=document.createElement('figure');figure.className='item';
 const button=document.createElement('button');button.className='image-button';button.type='button';button.setAttribute('aria-label',`View image ${i+1}`);
 const canvas=document.createElement('canvas');canvas.setAttribute('aria-hidden','true');button.append(canvas);
 const source=new Image();source.decoding='async';source.onload=()=>processThumbnail(source,canvas,i);
 source.onerror=()=>{const ctx=canvas.getContext('2d');canvas.width=280;canvas.height=198;ctx.fillStyle='#e5e5e5';ctx.fillRect(0,0,280,198)};
 source.src=work.src;
 button.addEventListener('click',()=>open(i));figure.append(button);gallery.append(figure);
}
function show(i){active=(i+works.length)%works.length;const work=works[active];document.getElementById('viewer-image').src=work.src;document.getElementById('viewer-image').alt=work.title}
function open(i){show(i);dialog.showModal()}
document.getElementById('close').onclick=()=>dialog.close();document.getElementById('prev').onclick=()=>show(active-1);document.getElementById('next').onclick=()=>show(active+1);dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowLeft')show(active-1);if(e.key==='ArrowRight')show(active+1)});
document.getElementById('count').textContent=`${works.length} IMAGES`;

const topChars=['S','O','T','(','E','Z','U','K',')','A'];
// The continuous perimeter reads bottom-to-top on the left and top-to-bottom on the right.
// The asterisks are separators, never missing-letter markers.
const entries=[{name:'PROJECTS',side:'left',hash:'#projects'},{name:'ABOUT',side:'left',hash:'#about'},{name:'CONTACT',side:'right',hash:'#contact'},{name:'STORE',side:'right',hash:'#store'}];
const top=document.getElementById('chart-top'),left=document.getElementById('chart-left'),right=document.getElementById('chart-right'),links=document.getElementById('chart-links');
for(const c of topChars){const el=document.createElement('span');el.textContent=c;if('EZUK'.includes(c))el.className='muted';top.append(el)}
function randInt(max){if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}return Math.floor(Math.random()*max)}
const leftSlots=[...('PROJECTS*ABOUT')].reverse(); // 14 positions, top-to-bottom
const rightSlots=[...('*CONTACT*STORE')]; // 14 positions, top-to-bottom
const used=new Set();
const choices=entries.map(entry=>{
 const slots=entry.side==='left'?leftSlots:rightSlots;
 const available=[];
 for(let i=0;i<slots.length;i++)if(entry.name.includes(slots[i])&&topChars.includes(slots[i])&&slots[i]!=='*'){
   // Restrict to the actual word's slots, excluding the other word on the same side.
   const original=entry.side==='left'?'PROJECTS*ABOUT':'*CONTACT*STORE';
   const offset=original.indexOf(entry.name);
   const originalIndex=entry.side==='left'?original.length-1-i:i;
   if(originalIndex>=offset&&originalIndex<offset+entry.name.length){
     const x=topChars.indexOf(slots[i]);const y=i;
     available.push({x,y,letter:slots[i]});
   }
 }
 // Prefer distinct X columns to keep invisible links distributed.
 const distinct=available.filter(p=>!used.has(p.x));const pool=distinct.length?distinct:available;
 const chosen=pool[randInt(pool.length)];used.add(chosen.x);return {...entry,...chosen};
});
function renderSide(target,slots,side){slots.forEach((char,i)=>{
 const el=document.createElement('span');el.className='chart-side-char '+side;
 const omitted=choices.some(p=>p.side===side&&p.y===i);
 if(omitted){el.classList.add('empty');el.textContent=' ';}else{el.textContent=char==='*'?'＊':char;}
 target.append(el);
});}
renderSide(left,leftSlots,'left');renderSide(right,rightSlots,'right');
choices.forEach(p=>{
 const a=document.createElement('a');a.className='coordinate-hotspot';a.href=p.hash;
 // Top letters and side letters align with the centres of their respective grid cells.
 a.style.left=((p.x+1)/11*100)+'%';a.style.top=((p.y+1)/15*100)+'%';
 const name=document.createElement('span');name.className='visually-hidden';name.textContent=p.name;a.append(name);
 links.append(a);
});
})();</script></body></html>
