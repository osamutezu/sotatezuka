<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Spatial Portfolio — Prototype</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white;font-family:Arial,'Helvetica Neue',sans-serif;color:#111}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:2;pointer-events:none}.top{top:24px;left:28px;font-size:13px;letter-spacing:.12em}.right{top:24px;right:28px;text-align:right;font-size:10px;line-height:1.8;color:#666}.bottom{bottom:24px;left:28px;font-size:10px;color:#777;letter-spacing:.08em}.counter{bottom:24px;right:28px;font-size:11px}@media(max-width:600px){.top{left:16px;top:18px}.right{right:16px;top:18px}.bottom{left:16px;bottom:18px}.counter{right:16px;bottom:18px}}</style></head><body><canvas id="scene"></canvas><div class="hud top">S / SPATIAL PORTFOLIO</div><div class="hud right">ONE-POINT PERSPECTIVE<br>SCROLL TO MOVE THROUGH SPACE</div><div class="hud bottom">SCROLL / SWIPE — FORWARD & BACKWARD</div><div class="hud counter" id="counter">Z 000.0</div><script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,depth=0,target=0,dragY=null;const maxDepth=185;const works=[{z:19,x:-5.2,y:1.6,w:4.6,h:3.2,title:'01 / ARCHITECTURE',sub:'Selected work — 2026'},{z:37,x:5.4,y:-1.1,w:4.3,h:5.2,title:'02 / RESEARCH',sub:'Studies & experiments'},{z:59,x:-5.7,y:-1.4,w:5.2,h:3.7,title:'03 / PHOTOGRAPHY',sub:'Image archive'},{z:80,x:4.5,y:2.3,w:5.3,h:3.5,title:'04 / OBJECTS',sub:'Material & form'},{z:108,x:-4.5,y:2,w:5,h:4,title:'05 / DRAWINGS',sub:'Plans & diagrams'},{z:135,x:4.3,y:-1.8,w:4.7,h:4.1,title:'06 / ABOUT',sub:'Profile & contact'},{z:165,x:0,y:0,w:5.5,h:3.2,title:'07 / INDEX',sub:'Spatial archive'}];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function proj(x,y,z){const zz=z-depth;if(zz<=.3)return null;const f=Math.min(W,H)*1.08;return {x:W/2+x*f/zz,y:H/2-y*f/zz,s:f/zz}}function line(a,b,color='#dedede',width=.75){if(!a||!b)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function rect3(x,y,z,w,h){let a=proj(x-w/2,y+h/2,z),b=proj(x+w/2,y-h/2,z);if(!a||!b)return null;return {x:a.x,y:a.y,w:b.x-a.x,h:b.y-a.y}}function draw(){depth+=(target-depth)*.095;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const tile=0.75;const start=Math.floor(depth/tile)*tile;for(let z=start+tile;z<depth+230;z+=tile){for(let side of [-1,1]){line(proj(side*9,-6,z),proj(side*9,6,z),'#dedede');line(proj(-9,-6,z),proj(9,-6,z),'#dedede');line(proj(-9,6,z),proj(9,6,z),'#dedede')}}for(let x=-9;x<=9;x+=0.75){line(proj(x,-6,depth+1),proj(x,-6,depth+240),'#dedede');line(proj(x,6,depth+1),proj(x,6,depth+240),'#dedede')}for(let y=-6;y<=6;y+=0.75){line(proj(-9,y,depth+1),proj(-9,y,depth+240),'#dedede');line(proj(9,y,depth+1),proj(9,y,depth+240),'#dedede')}for(const work of works){let dz=work.z-depth;if(dz<1||dz>175)continue;let r=rect3(work.x,work.y,work.z,work.w,work.h);if(!r)continue;ctx.fillStyle='#fff';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#888';ctx.lineWidth=.85;ctx.strokeRect(r.x,r.y,r.w,r.h);const size=Math.max(7,Math.min(21,13*r.w/180));ctx.save();ctx.beginPath();ctx.rect(r.x,r.y,r.w,r.h);ctx.clip();ctx.fillStyle='#222';ctx.font=`${size}px Arial`;ctx.fillText(work.title,r.x+Math.max(5,r.w*.07),r.y+Math.max(13,r.h*.18));ctx.fillStyle='#888';ctx.font=`${Math.max(6,size*.65)}px Arial`;ctx.fillText(work.sub,r.x+Math.max(5,r.w*.07),r.y+Math.max(24,r.h*.3));ctx.strokeStyle='#ddd';ctx.beginPath();ctx.moveTo(r.x+r.w*.07,r.y+r.h*.8);ctx.lineTo(r.x+r.w*.93,r.y+r.h*.8);ctx.stroke();ctx.restore()}document.getElementById('counter').textContent='Z '+depth.toFixed(1).padStart(5,'0');requestAnimationFrame(draw)}draw();addEventListener('wheel',e=>{e.preventDefault();target=Math.max(0,Math.min(maxDepth,target+e.deltaY*.035))},{passive:false});addEventListener('touchstart',e=>{dragY=e.touches[0].clientY},{passive:true});addEventListener('touchmove',e=>{if(dragY===null)return;e.preventDefault();let y=e.touches[0].clientY;target=Math.max(0,Math.min(maxDepth,target+(dragY-y)*.08));dragY=y},{passive:false});addEventListener('touchend',()=>dragY=null);addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){target=Math.max(0,Math.min(maxDepth,target+(e.key==='ArrowDown'?8:-8)))}});
</script></body></html>
