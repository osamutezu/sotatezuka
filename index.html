function letterGlyph(c){
 const data=GLYPH_PATHS[c];
 if(!data)return document.createTextNode(c);
 const [d,w]=data;
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('class','glyph');svg.setAttribute('viewBox',`0 0 ${w} 1000`);
 svg.setAttribute('preserveAspectRatio','xMidYMid meet');
 svg.setAttribute('aria-hidden','true');
 const path=document.createElementNS('http://www.w3.org/2000/svg','path');
 path.setAttribute('d',d);path.setAttribute('transform','translate(0 800) scale(1 -1)');path.setAttribute('fill','currentColor');svg.append(path);
 return svg;
}

// Draw grid lines at exact lattice coordinates rather than relying on repeating CSS backgrounds.
const gridNode=document.querySelector('.chart-grid');
const svgNS='http://www.w3.org/2000/svg';
const gridSvg=document.createElementNS(svgNS,'svg');
gridSvg.setAttribute('viewBox','0 0 1100 1500');
gridSvg.setAttribute('preserveAspectRatio','none');
gridSvg.setAttribute('aria-hidden','true');
for(let i=1;i<11;i++){
 const line=document.createElementNS(svgNS,'line');
 line.setAttribute('x1',String(i*100));line.setAttribute('x2',String(i*100));
 line.setAttribute('y1','0');line.setAttribute('y2','1500');
 line.setAttribute('stroke','#e5e5e5');line.setAttribute('stroke-width','.85');line.setAttribute('vector-effect','non-scaling-stroke');
 gridSvg.append(line);
}
for(let i=1;i<15;i++){
 const line=document.createElementNS(svgNS,'line');
 line.setAttribute('x1','0');line.setAttribute('x2','1100');
 line.setAttribute('y1',String(i*100));line.setAttribute('y2',String(i*100));
 line.setAttribute('stroke','#e5e5e5');line.setAttribute('stroke-width','.85');line.setAttribute('vector-effect','non-scaling-stroke');
 gridSvg.append(line);
}
gridNode.replaceChildren(gridSvg);
const topChars=['S','O','T','(','E','Z','U','K',')','A'];
// Both side labels now read top-to-bottom; the asterisks remain separators.
// The asterisks are separators, never missing-letter markers.
const entries=[{name:'PROJECTS',side:'left',hash:'#projects'},{name:'ABOUT',side:'left',hash:'#about'},{name:'CONTACT',side:'right',hash:'#contact'},{name:'STORE',side:'right',hash:'#store'}];
const top=document.getElementById('chart-top'),left=document.getElementById('chart-left'),right=document.getElementById('chart-right'),links=document.getElementById('chart-links');
for(const [i,c] of topChars.entries()){const el=document.createElement('span');el.style.left=((i+1)/11*100)+'%';el.append(letterGlyph(c));el.setAttribute('aria-label',c);top.append(el)}
function randInt(max){if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}return Math.floor(Math.random()*max)}
const leftSlots=[...('PROJECTS*ABOUT')]; // 14 positions, top-to-bottom
const rightSlots=[...('*CONTACT*STORE')]; // 14 positions, top-to-bottom
const used=new Set();
const choices=entries.map(entry=>{
 const slots=entry.side==='left'?leftSlots:rightSlots;
 const available=[];
 for(let i=0;i<slots.length;i++)if(entry.name.includes(slots[i])&&topChars.includes(slots[i])&&slots[i]!=='*'){
   // Restrict to the actual word's slots, excluding the other word on the same side.
   const original=entry.side==='left'?'PROJECTS*ABOUT':'*CONTACT*STORE';
   const offset=original.indexOf(entry.name);
   const originalIndex=i;
   if(originalIndex>=offset&&originalIndex<offset+entry.name.length){
     const x=topChars.indexOf(slots[i]);const y=i;
     available.push({x,y,letter:slots[i]});
   }
 }
 // Prefer distinct X columns to keep invisible links distributed.
 const distinct=available.filter(p=>!used.has(p.x));const pool=distinct.length?distinct:available;
 const chosen=pool[randInt(pool.length)];used.add(chosen.x);return {...entry,...chosen};
});
function renderSide(target,slots,side){slots.forEach((char,i)=>{
 const word=entries.find(entry=>{
   if(entry.side!==side)return false;
   const source=side==='left'?'PROJECTS*ABOUT':'*CONTACT*STORE';
   const start=source.indexOf(entry.name);
   return i>=start&&i<start+entry.name.length;
 });
 const omitted=choices.some(p=>p.side===side&&p.y===i);
 const el=document.createElement('span');
 el.className='chart-side-char '+side;
 el.style.top=((i+1)/15*100)+'%';
 if(omitted){el.classList.add('empty');el.textContent=' ';}
 else{
   el.append(letterGlyph(char));
   el.setAttribute('aria-label',word?word.name:'Separator');
 }
 target.append(el);
});}
renderSide(left,leftSlots,'left');renderSide(right,rightSlots,'right');
choices.forEach(p=>{
 const a=document.createElement('a');a.className='coordinate-hotspot';a.href=p.hash;a.setAttribute('aria-label',p.name);
 // Top letters and side letters align with the centres of their respective grid cells.
 a.style.left=((p.x+1)/11*100)+'%';a.style.top=((p.y+1)/15*100)+'%';
 const name=document.createElement('span');name.className='visually-hidden';name.textContent=p.name;a.append(name);const point=document.createElement('span');point.className='coordinate-point';point.setAttribute('aria-hidden','true');a.append(point);
 links.append(a);
});
