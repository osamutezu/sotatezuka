<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Spatial Portfolio — Tiled Gallery</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white;font-family:Arial,'Helvetica Neue',sans-serif;color:#111}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:2;pointer-events:none}.top{top:24px;left:28px;font-size:13px;letter-spacing:.12em}.right{top:24px;right:28px;text-align:right;font-size:10px;line-height:1.8;color:#666}.bottom{bottom:24px;left:28px;font-size:10px;color:#777;letter-spacing:.08em}.counter{bottom:24px;right:28px;font-size:11px}@media(max-width:600px){.top{left:16px;top:18px}.right{right:16px;top:18px}.bottom{left:16px;bottom:18px}.counter{right:16px;bottom:18px}}</style></head><body><canvas id="scene"></canvas><div class="hud top">S / SPATIAL PORTFOLIO</div><div class="hud right">ONE-POINT PERSPECTIVE<br>SCROLL TO MOVE THROUGH SPACE</div><div class="hud bottom">SCROLL / SWIPE — FORWARD & BACKWARD</div><div class="hud counter" id="counter">Z 000.0</div><script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,depth=0,target=0,dragY=null;const maxDepth=185;const works=[{z:19,x:-5.2,y:1.6,w:4.6,h:3.2,title:'01 / ARCHITECTURE',sub:'Selected work — 2026'},{z:37,x:5.4,y:-1.1,w:4.3,h:5.2,title:'02 / RESEARCH',sub:'Studies & experiments'},{z:59,x:-5.7,y:-1.4,w:5.2,h:3.7,title:'03 / PHOTOGRAPHY',sub:'Image archive'},{z:80,x:4.5,y:2.3,w:5.3,h:3.5,title:'04 / OBJECTS',sub:'Material & form'},{z:108,x:-4.5,y:2,w:5,h:4,title:'05 / DRAWINGS',sub:'Plans & diagrams'},{z:135,x:4.3,y:-1.8,w:4.7,h:4.1,title:'06 / ABOUT',sub:'Profile & contact'},{z:165,x:0,y:0,w:5.5,h:3.2,title:'07 / INDEX',sub:'Spatial archive'}];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function proj(x,y,z){const zz=z-depth;if(zz<=.3)return null;const f=Math.min(W,H)*1.08;return {x:W/2+x*f/zz,y:H/2-y*f/zz,s:f/zz}}function line(a,b,color='#dedede',width=.75){if(!a||!b)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function rect3(x,y,z,w,h){let a=proj(x-w/2,y+h/2,z),b=proj(x+w/2,y-h/2,z);if(!a||!b)return null;return {x:a.x,y:a.y,w:b.x-a.x,h:b.y-a.y}}function quad(points,fill){if(points.some(p=>!p))return;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function tileShade(a,b,c){let n=Math.sin(a*127.1+b*311.7+c*71.9)*43758.5453;n=n-Math.floor(n);return Math.round(247+n*6)}
function surfaces(){const t=.75,near=depth+.9,far=depth+110;let z0=Math.floor(near/t)*t;for(let z=z0;z<far;z+=t){if(z<=near)continue;let zz=z+t;if(z-depth>80)break;for(let x=-9;x<9;x+=t){let shade=tileShade(Math.round(x/t),Math.round(z/t),1);let fill=`rgb(${shade},${shade},${Math.min(255,shade+1)})`;quad([proj(x,-6,z),proj(x+t,-6,z),proj(x+t,-6,zz),proj(x,-6,zz)],fill);if(z-depth<45){let ceiling=tileShade(Math.round(x/t),Math.round(z/t),2);quad([proj(x,6,z),proj(x+t,6,z),proj(x+t,6,zz),proj(x,6,zz)],`rgb(${ceiling},${ceiling},${ceiling})`)}}for(let y=-6;y<6;y+=t){for(let side of [-1,1]){let shade=tileShade(side*20+Math.round(y/t),Math.round(z/t),3);quad([proj(side*9,y,z),proj(side*9,y+t,z),proj(side*9,y+t,zz),proj(side*9,y,zz)],`rgb(${shade},${shade},${shade})`)}}}}
function lightFixture(z,x){let dz=z-depth;if(dz<1.4||dz>120)return;const cy=5.05,top=6,half=.16,len=5.2;const left=x-half,right=x+half,z1=z-len/2,z2=z+len/2;if(z1-depth<.65)return;
// Thin suspension cables follow the same 3D perspective as the tiles.
for(let zz of [z1+.4,z2-.4])line(proj(x,top,zz),proj(x,cy+.13,zz),'#989898',Math.max(.45,Math.min(1.1,3/dz)));
quad([proj(left,cy+.12,z1),proj(right,cy+.12,z1),proj(right,cy+.12,z2),proj(left,cy+.12,z2)],'#a7a7a7');
quad([proj(left,cy-.1,z1),proj(right,cy-.1,z1),proj(right,cy-.1,z2),proj(left,cy-.1,z2)],'#f8f8f8');
quad([proj(left,cy-.085,z1),proj(right,cy-.085,z1),proj(right,cy-.085,z2),proj(left,cy-.085,z2)],'#fff');
let p=proj(x,cy-.09,z);if(p){let radius=Math.min(30,65/dz);let g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius*2);g.addColorStop(0,'rgba(245,245,235,.14)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,radius*2,0,Math.PI*2);ctx.fill()}}
function lights(){const spacing=11;let first=Math.floor((depth-6)/spacing)*spacing;for(let z=first+spacing;z<depth+125;z+=spacing){lightFixture(z,-4.3);lightFixture(z,4.3)}}
function draw(){depth+=(target-depth)*.095;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);surfaces();const tile=.75;const start=Math.floor(depth/tile)*tile;for(let z=start+tile;z<depth+110;z+=tile){for(let side of [-1,1]){line(proj(side*9,-6,z),proj(side*9,6,z),'#c7c7c7',.55);line(proj(-9,-6,z),proj(9,-6,z),'#c7c7c7',.55);line(proj(-9,6,z),proj(9,6,z),'#c7c7c7',.55)}}for(let x=-9;x<=9;x+=tile){line(proj(x,-6,depth+.9),proj(x,-6,depth+110),'#c7c7c7',.55);line(proj(x,6,depth+.9),proj(x,6,depth+110),'#c7c7c7',.55)}for(let y=-6;y<=6;y+=tile){line(proj(-9,y,depth+.9),proj(-9,y,depth+110),'#c7c7c7',.55);line(proj(9,y,depth+.9),proj(9,y,depth+110),'#c7c7c7',.55)}lights();for(const work of works){let dz=work.z-depth;if(dz<1||dz>175)continue;let r=rect3(work.x,work.y,work.z,work.w,work.h);if(!r)continue;ctx.fillStyle='#fff';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#888';ctx.lineWidth=.85;ctx.strokeRect(r.x,r.y,r.w,r.h);const size=Math.max(7,Math.min(21,13*r.w/180));ctx.save();ctx.beginPath();ctx.rect(r.x,r.y,r.w,r.h);ctx.clip();ctx.fillStyle='#222';ctx.font=`${size}px Arial`;ctx.fillText(work.title,r.x+Math.max(5,r.w*.07),r.y+Math.max(13,r.h*.18));ctx.fillStyle='#888';ctx.font=`${Math.max(6,size*.65)}px Arial`;ctx.fillText(work.sub,r.x+Math.max(5,r.w*.07),r.y+Math.max(24,r.h*.3));ctx.strokeStyle='#ddd';ctx.beginPath();ctx.moveTo(r.x+r.w*.07,r.y+r.h*.8);ctx.lineTo(r.x+r.w*.93,r.y+r.h*.8);ctx.stroke();ctx.restore()}document.getElementById('counter').textContent='Z '+depth.toFixed(1).padStart(5,'0');requestAnimationFrame(draw)}draw();addEventListener('wheel',e=>{e.preventDefault();target=Math.max(0,Math.min(maxDepth,target+e.deltaY*.035))},{passive:false});addEventListener('touchstart',e=>{dragY=e.touches[0].clientY},{passive:true});addEventListener('touchmove',e=>{if(dragY===null)return;e.preventDefault();let y=e.touches[0].clientY;target=Math.max(0,Math.min(maxDepth,target+(dragY-y)*.08));dragY=y},{passive:false});addEventListener('touchend',()=>dragY=null);addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){target=Math.max(0,Math.min(maxDepth,target+(e.key==='ArrowDown'?8:-8)))}});
</script></body></html>
