const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,depth=0,target=0,dragY=null;const maxDepth=185;const works=[{z:19,x:-5.2,y:1.6,w:4.6,h:3.2,title:'01 / ARCHITECTURE',sub:'Selected work — 2026'},{z:37,x:5.4,y:-1.1,w:4.3,h:5.2,title:'02 / RESEARCH',sub:'Studies & experiments'},{z:59,x:-5.7,y:-1.4,w:5.2,h:3.7,title:'03 / PHOTOGRAPHY',sub:'Image archive'},{z:80,x:4.5,y:2.3,w:5.3,h:3.5,title:'04 / OBJECTS',sub:'Material & form'},{z:108,x:-4.5,y:2,w:5,h:4,title:'05 / DRAWINGS',sub:'Plans & diagrams'},{z:135,x:4.3,y:-1.8,w:4.7,h:4.1,title:'06 / ABOUT',sub:'Profile & contact'},{z:165,x:0,y:0,w:5.5,h:3.2,title:'07 / INDEX',sub:'Spatial archive'}];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function proj(x,y,z){const zz=z-depth;if(zz<=.3)return null;const f=Math.min(W,H)*1.08;return {x:W/2+x*f/zz,y:H/2-y*f/zz,s:f/zz}}function line(a,b,color='#dedede',width=.75){if(!a||!b)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function rect3(x,y,z,w,h){let a=proj(x-w/2,y+h/2,z),b=proj(x+w/2,y-h/2,z);if(!a||!b)return null;return {x:a.x,y:a.y,w:b.x-a.x,h:b.y-a.y}}function quad(points,fill){if(points.some(p=>!p))return;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
