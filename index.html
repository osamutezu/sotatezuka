<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="SOTA TEZUKA — Portfolio"><title>SOTA TEZUKA</title>
<style>
:root{--gap:clamp(12px,2.15vw,30px);--ink:#191919;--muted:#747474}*{box-sizing:border-box}html{background:white}body{margin:0;color:var(--ink);background:#fff;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}header{padding:24px var(--gap) 23px;display:flex;align-items:baseline;justify-content:space-between;gap:16px}h1{font-size:clamp(15px,1.5vw,20px);font-weight:500;letter-spacing:.095em;margin:0}header small{font-size:10px;letter-spacing:.09em;color:var(--muted)}main{padding:0 var(--gap) var(--gap)}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}.item{margin:0;min-width:0}.image-button{display:block;position:relative;aspect-ratio:1.41421356237/1;width:100%;border:0;padding:0;background:#f3f3f1;overflow:hidden;cursor:zoom-in}.image-button img{display:block;width:100%;height:100%;object-fit:cover}.image-button:focus-visible{outline:2px solid #111;outline-offset:3px}.image-button:hover img{opacity:.86}.caption{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:10px;line-height:1.4;letter-spacing:.035em}.caption .number{color:var(--muted);font-family:monospace}footer{padding:20px var(--gap) 30px;display:flex;justify-content:space-between;color:var(--muted);font:10px monospace}dialog{border:0;padding:0;max-width:none;max-height:none;width:100vw;height:100dvh;background:#fff;color:#111}dialog::backdrop{background:#fff}.viewer{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:var(--gap);gap:var(--gap)}.viewer-head{display:flex;justify-content:space-between;align-items:center;font:12px monospace}.viewer-head button{border:0;background:none;padding:8px;cursor:pointer;font:12px monospace}.viewer-image{width:100%;height:100%;object-fit:contain;min-height:0}.viewer-foot{display:flex;justify-content:space-between;font:11px monospace;color:#555}.viewer-foot button{border:1px solid #aaa;background:white;padding:7px 13px;cursor:pointer}.viewer-actions{display:flex;gap:7px} @media(max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){header{padding-top:20px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.caption{font-size:9px}header small{font-size:9px}}@media(max-width:340px){.gallery{grid-template-columns:1fr}}
</style></head><body><header><h1>SOTA TEZUKA</h1><small>SELECTED IMAGES / PORTFOLIO</small></header><main><div class="gallery" id="gallery"></div></main><footer><span>© SOTA TEZUKA</span><span id="count">12 IMAGES</span></footer><dialog id="lightbox" aria-label="Image viewer"><div class="viewer"><div class="viewer-head"><span id="viewer-title"></span><button id="close" aria-label="Close">CLOSE ×</button></div><img class="viewer-image" id="viewer-image" alt=""><div class="viewer-foot"><span id="viewer-count"></span><div class="viewer-actions"><button id="prev" aria-label="Previous image">← PREV</button><button id="next" aria-label="Next image">NEXT →</button></div></div></div></dialog>
<script>
(()=>{'use strict';
// Replace image paths and titles below with your actual works. All source images are placeholders.
const works=Array.from({length:12},(_,i)=>({src:`images/${String(i+1).padStart(2,'0')}.svg`,title:`IMAGE ${String(i+1).padStart(2,'0')}`}));
const gallery=document.getElementById('gallery'),dialog=document.getElementById('lightbox');let active=0;
for(let i=0;i<works.length;i++){const work=works[i];const figure=document.createElement('figure');figure.className='item';const button=document.createElement('button');button.className='image-button';button.type='button';button.setAttribute('aria-label',`View ${work.title}`);const img=document.createElement('img');img.src=work.src;img.alt=work.title;img.loading=i<6?'eager':'lazy';img.decoding='async';button.append(img);button.addEventListener('click',()=>open(i));const caption=document.createElement('figcaption');caption.className='caption';const title=document.createElement('span');title.textContent=work.title;const number=document.createElement('span');number.className='number';number.textContent=String(i+1).padStart(2,'0');caption.append(title,number);figure.append(button,caption);gallery.append(figure)}
function show(i){active=(i+works.length)%works.length;const work=works[active];document.getElementById('viewer-image').src=work.src;document.getElementById('viewer-image').alt=work.title;document.getElementById('viewer-title').textContent=work.title;document.getElementById('viewer-count').textContent=`${active+1} / ${works.length}`}
function open(i){show(i);dialog.showModal()}
document.getElementById('close').onclick=()=>dialog.close();document.getElementById('prev').onclick=()=>show(active-1);document.getElementById('next').onclick=()=>show(active+1);dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowLeft')show(active-1);if(e.key==='ArrowRight')show(active+1)});
document.getElementById('count').textContent=`${works.length} IMAGES`;
})();
</script></body></html>
